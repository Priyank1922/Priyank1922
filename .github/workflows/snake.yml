name: Generate Coding Contribution Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate coding animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          mkdir -p dist

          python3 <<'PY'
          import os
          import json
          import urllib.request
          import html

          token = os.environ["GITHUB_TOKEN"]
          username = os.environ["GITHUB_USER"]

          query = """
          query($user:String!) {
            user(login:$user) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      color
                      date
                    }
                  }
                }
              }
            }
          }
          """

          data = json.dumps({
              "query": query,
              "variables": {"user": username}
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=data,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "User-Agent": "GitHub-Coding-Animation"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read())

          calendar = result["data"]["user"]["contributionsCollection"]["contributionCalendar"]

          weeks = calendar["weeks"]
          total = calendar["totalContributions"]

          cells = []

          for week_index, week in enumerate(weeks):
              for day_index, day in enumerate(week["contributionDays"]):
                  count = day["contributionCount"]

                  # GitHub contribution intensity
                  if count == 0:
                      level = 0
                  elif count <= 3:
                      level = 1
                  elif count <= 6:
                      level = 2
                  elif count <= 9:
                      level = 3
                  else:
                      level = 4

                  cells.append({
                      "x": week_index,
                      "y": day_index,
                      "level": level,
                      "count": count
                  })

          svg_width = 1100
          svg_height = 420

          cell_size = 11
          gap = 3

          start_x = 35
          start_y = 225

          colors = [
              "#161b22",
              "#0e4429",
              "#006d32",
              "#26a641",
              "#39d353"
          ]

          rects = ""

          for i, cell in enumerate(cells):
              x = start_x + cell["x"] * (cell_size + gap)
              y = start_y + cell["y"] * (cell_size + gap)

              delay = (i % 80) * 0.025

              rects += f"""
              <rect
                x="{x}"
                y="{y}"
                width="{cell_size}"
                height="{cell_size}"
                rx="2"
                fill="{colors[cell['level']]}"
                opacity="0">
                <title>{cell['count']} contributions</title>
                <animate
                  attributeName="opacity"
                  from="0"
                  to="1"
                  dur="0.5s"
                  begin="{delay:.2f}s"
                  fill="freeze"/>
              </rect>
              """

          svg = f'''<svg
          xmlns="http://www.w3.org/2000/svg"
          width="{svg_width}"
          height="{svg_height}"
          viewBox="0 0 {svg_width} {svg_height}">

          <defs>

            <linearGradient id="terminalGradient"
              x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#39d353"/>
              <stop offset="50%" stop-color="#00ff88"/>
              <stop offset="100%" stop-color="#39d353"/>
            </linearGradient>

            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>

          </defs>

          <!-- Terminal background -->
          <rect
            width="1100"
            height="420"
            rx="14"
            fill="#0d1117"
            stroke="#30363d"
            stroke-width="2"/>

          <!-- Terminal header -->
          <rect
            x="1"
            y="1"
            width="1098"
            height="42"
            rx="14"
            fill="#161b22"/>

          <!-- Terminal buttons -->
          <circle cx="25" cy="22" r="6" fill="#ff5f56"/>
          <circle cx="45" cy="22" r="6" fill="#ffbd2e"/>
          <circle cx="65" cy="22" r="6" fill="#27c93f"/>

          <!-- Terminal title -->
          <text
            x="550"
            y="27"
            text-anchor="middle"
            fill="#8b949e"
            font-family="monospace"
            font-size="13">
            priyank@github: ~/coding
          </text>

          <!-- Terminal command -->
          <text
            x="35"
            y="82"
            fill="#39d353"
            font-family="monospace"
            font-size="18"
            filter="url(#glow)">
            $ git status
          </text>

          <text
            x="35"
            y="110"
            fill="#c9d1d9"
            font-family="monospace"
            font-size="16">
            &gt; contribution activity detected...
          </text>

          <!-- Animated typing cursor -->
          <rect
            x="365"
            y="95"
            width="9"
            height="20"
            fill="#39d353">
            <animate
              attributeName="opacity"
              values="1;0;1"
              dur="0.8s"
              repeatCount="indefinite"/>
          </rect>

          <!-- Coding stack -->
          <text
            x="35"
            y="155"
            fill="url(#terminalGradient)"
            font-family="monospace"
            font-size="15">

            <tspan x="35">Java</tspan>
            <tspan x="135">Spring Boot</tspan>
            <tspan x="300">Microservices</tspan>
            <tspan x="485">Spring AI</tspan>
            <tspan x="605">GenAI</tspan>
            <tspan x="710">REST APIs</tspan>
            <tspan x="855">MySQL</tspan>

            <animate
              attributeName="opacity"
              values="0.4;1;0.4"
              dur="3s"
              repeatCount="indefinite"/>
          </text>

          <!-- Code line -->
          <text
            x="35"
            y="190"
            fill="#8b949e"
            font-family="monospace"
            font-size="13">
            public class Developer &#123; // building something every day
          </text>

          <!-- Contribution graph -->
          {rects}

          <!-- Footer -->
          <text
            x="35"
            y="390"
            fill="#8b949e"
            font-family="monospace"
            font-size="13">
            $ git log --activity
          </text>

          <text
            x="1060"
            y="390"
            text-anchor="end"
            fill="#39d353"
            font-family="monospace"
            font-size="13">
            {total} contributions
          </text>

          </svg>
          '''

          with open("dist/github-coding-animation.svg", "w") as f:
              f.write(svg)

          print(f"Generated coding animation with {total} contributions.")
          PY

      - name: Push animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
