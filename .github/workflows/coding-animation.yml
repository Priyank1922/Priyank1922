name: Generate Java Coding Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Generate Java Contribution Graph
        run: |
          python3 <<'PY'
          import json
          import urllib.request
          import datetime

          username = "Priyank1922"

          url = f"https://github-contributions-api.jogruber.de/v4/{username}?y=last"

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "GitHub-Contribution-Graph"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.loads(response.read())

          contributions = {
              item["date"]: item["count"]
              for item in data["contributions"]
          }

          total = sum(contributions.values())

          colors = [
              "#161b22",
              "#0e4429",
              "#006d32",
              "#26a641",
              "#39d353"
          ]

          today = datetime.date.today()
          start = today - datetime.timedelta(days=364)
          start -= datetime.timedelta(days=(start.weekday() + 1) % 7)

          cells = []
          month_labels = []
          previous_month = None
          week = 0

          current = start

          while current <= today:
              count = contributions.get(current.isoformat(), 0)

              level = (
                  0 if count == 0 else
                  1 if count <= 2 else
                  2 if count <= 5 else
                  3 if count <= 9 else 4
              )

              x = 190 + week * 14
              y = 76 + ((current.weekday() + 1) % 7) * 14

              cells.append(
                  f'<rect x="{x}" y="{y}" width="10" height="10" '
                  f'rx="2" fill="{colors[level]}">'
                  f'<title>{current}: {count} contributions</title>'
                  f'</rect>'
              )

              if current.month != previous_month and current.day <= 7:
                  month_labels.append(
                      f'<text x="{x}" y="64" fill="#94a3b8" '
                      f'font-size="11">{current.strftime("%b")}</text>'
                  )
                  previous_month = current.month

              if (current.weekday() + 1) % 7 == 6:
                  week += 1

              current += datetime.timedelta(days=1)

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="1000" height="220" viewBox="0 0 1000 220">

          <defs>
            <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#0d1117"/>
              <stop offset="100%" stop-color="#161b22"/>
            </linearGradient>
          </defs>

          <rect width="1000" height="220" rx="14" fill="url(#background)"/>

          <rect x="1" y="1" width="998" height="218" rx="14"
                fill="none" stroke="#30363d"/>

          <!-- Header -->
          <text x="35" y="39" fill="#f0f6fc"
                font-family="monospace" font-size="20"
                font-weight="bold">
            &lt;/&gt; Java Developer
          </text>

          <text x="965" y="38" fill="#f89820"
                font-family="monospace" font-size="13"
                text-anchor="end">
            PRIYANK MEHTA
          </text>

          <text x="35" y="62" fill="#8b949e"
                font-family="monospace" font-size="11">
            A year of coding, learning and building.
          </text>

          <!-- Month labels -->
          {''.join(month_labels)}

          <!-- Contribution graph -->
          {''.join(cells)}

          <!-- Footer -->
          <text x="35" y="197" fill="#f89820"
                font-family="monospace" font-size="13"
                font-weight="bold">
            {total}
          </text>

          <text x="75" y="197" fill="#8b949e"
                font-family="monospace" font-size="12">
            contributions in the last year
          </text>

          <text x="965" y="197" fill="#8b949e"
                font-family="monospace" font-size="11"
                text-anchor="end">
            JAVA • SPRING BOOT • GEN AI
          </text>

          </svg>'''

          import os
          os.makedirs("dist", exist_ok=True)

          with open("dist/java-code-animation.svg", "w") as file:
              file.write(svg)

          print("Java contribution graph generated successfully!")
          print(f"Total contributions: {total}")
          PY

      - name: Publish Graph
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
