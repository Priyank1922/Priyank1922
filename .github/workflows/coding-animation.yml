name: Generate Java Coding Animation

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Generate Java Contribution Graph
        run: |
          mkdir -p dist

          python - <<'PY'
          import requests
          import datetime
          import html

          username = "Priyank1922"

          url = f"https://github-contributions-api.jogruber.de/v4/{username}?y=last"
          response = requests.get(url, timeout=30)
          response.raise_for_status()

          contributions = response.json()["contributions"]

          data = {
              item["date"]: item["count"]
              for item in contributions
          }

          today = datetime.date.today()
          start = today - datetime.timedelta(days=364)
          start -= datetime.timedelta(days=(start.weekday() + 1) % 7)

          colors = [
              "#161b22",
              "#0e4429",
              "#006d32",
              "#26a641",
              "#39d353"
          ]

          cells = []
          months = []
          week = 0
          previous_month = -1

          current = start

          while current <= today:
              count = data.get(current.isoformat(), 0)

              level = 0 if count == 0 else (
                  1 if count <= 2 else
                  2 if count <= 5 else
                  3 if count <= 9 else 4
              )

              x = 105 + week * 15
              y = 112 + current.weekday() * 15

              cells.append(
                  f'<rect x="{x}" y="{y}" width="11" height="11" '
                  f'rx="2" fill="{colors[level]}">'
                  f'<title>{current}: {count} contributions</title></rect>'
              )

              if current.month != previous_month and current.weekday() == 0:
                  months.append(
                      f'<text x="{x}" y="99" fill="#a78bfa" '
                      f'font-size="11" font-family="monospace">'
                      f'{current.strftime("%b")}</text>'
                  )
                  previous_month = current.month

              if current.weekday() == 6:
                  week += 1

              current += datetime.timedelta(days=1)

          total = sum(data.values())

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg"
          width="1000" height="285" viewBox="0 0 1000 285">

          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#111827"/>
              <stop offset="100%" stop-color="#1e1b4b"/>
            </linearGradient>
          </defs>

          <rect width="1000" height="285" rx="16" fill="url(#bg)"/>
          <rect x="1" y="1" width="998" height="283" rx="16"
                fill="none" stroke="#7c3aed" stroke-opacity=".6"/>

          <rect width="1000" height="42" rx="16" fill="#18181b"/>

          <circle cx="24" cy="21" r="6" fill="#ef4444"/>
          <circle cx="44" cy="21" r="6" fill="#eab308"/>
          <circle cx="64" cy="21" r="6" fill="#22c55e"/>

          <text x="90" y="26" fill="#e5e7eb"
                font-family="monospace" font-size="14">
            Priyank.java — GitHub Contribution History
          </text>

          <text x="970" y="26" fill="#a78bfa"
                font-family="monospace" font-size="12"
                text-anchor="end">JAVA DEVELOPER</text>

          <text x="35" y="70" fill="#c084fc"
                font-family="monospace" font-size="17"
                font-weight="bold">
            &lt;developer name="Priyank Mehta"&gt;
          </text>

          <text x="35" y="91" fill="#94a3b8"
                font-family="monospace" font-size="12">
            // A year of building, committing and improving.
          </text>

          {''.join(months)}

          <g>
            {''.join(cells)}
          </g>

          <text x="35" y="239" fill="#34d399"
                font-family="monospace" font-size="13">
            Total Contributions: {total}
          </text>

          <text x="35" y="260" fill="#a78bfa"
                font-family="monospace" font-size="12">
            Java | Spring Boot | Backend Engineering | Gen AI
          </text>

          <g font-family="monospace" font-size="10" fill="#94a3b8">
            <text x="770" y="239">Less</text>
            {''.join(
                f'<rect x="{810 + i*16}" y="228" width="11" height="11" '
                f'rx="2" fill="{colors[i]}"/>'
                for i in range(5)
            )}
            <text x="900" y="239">More</text>
          </g>

          <rect x="0" y="273" width="1000" height="12"
                fill="#312e81"/>

          </svg>'''

          with open("dist/java-code-animation.svg", "w") as file:
              file.write(svg)

          print("Java contribution graph generated successfully.")
          PY

      - name: Publish Graph
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
