name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-3d-graph-and-momentum
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate momentum graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import os, json, datetime as dt, urllib.request

          def fetch(user, token):
              to = dt.datetime.utcnow().replace(microsecond=0)
              frm = to - dt.timedelta(days=365)
              q = ('query($u:String!,$f:DateTime!,$t:DateTime!){user(login:$u){contributionsCollection(from:$f,to:$t)'
                   '{contributionCalendar{weeks{contributionDays{date contributionCount}}}}}}')
              body = json.dumps({"query": q, "variables": {"u": user, "f": frm.isoformat() + "Z", "t": to.isoformat() + "Z"}}).encode()
              req = urllib.request.Request("https://api.github.com/graphql", data=body, headers={
                  "Authorization": "bearer " + token, "Content-Type": "application/json", "User-Agent": "momentum"})
              d = json.load(urllib.request.urlopen(req))
              weeks = d["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]
              return [(x["date"], x["contributionCount"]) for w in weeks for x in w["contributionDays"]]

          def render(days):
              W, H, L, R, T, B = 845, 260, 50, 95, 50, 40
              total, cum = 0, []
              for _, c in days:
                  total += c
                  cum.append(total)
              n, top = len(cum), max(total, 1)
              px = lambda i: L + (W - L - R) * i / max(n - 1, 1)
              py = lambda v: H - B - (H - B - T) * v / top
              pts = " ".join(f"{px(i):.1f},{py(v):.1f}" for i, v in enumerate(cum))
              area = f"{L},{H-B} {pts} {px(n-1):.1f},{H-B}"
              labels, last = [], None
              for i, (d, _) in enumerate(days):
                  m = d[:7]
                  if m != last and d[8:] <= "07":
                      labels.append(f'<text x="{px(i):.1f}" y="{H-14}" fill="#8b949e" font-size="11" font-family="monospace">{dt.date.fromisoformat(d).strftime("%b")}</text>')
                  last = m
              return f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">
          <rect width="{W}" height="{H}" rx="10" fill="#0d1117" stroke="#30363d"/>
          <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient></defs>
          <text x="24" y="30" fill="#58a6ff" font-size="12" font-family="monospace" letter-spacing="2">MOMENTUM</text>
          <text x="{W-24}" y="30" fill="#8b949e" font-size="11" font-family="monospace" text-anchor="end">ROLLING 12 MONTHS · ALL CONTRIBUTION TYPES</text>
          <line x1="{L}" y1="{H-B}" x2="{W-R}" y2="{H-B}" stroke="#30363d"/>
          <polygon points="{area}" fill="url(#g)"/>
          <polyline points="{pts}" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round"/>
          <circle cx="{px(n-1):.1f}" cy="{py(total):.1f}" r="4" fill="#38bdf8"/>
          <text x="{px(n-1)+12:.1f}" y="{py(total)+8:.1f}" fill="#ffffff" font-size="26" font-weight="700" font-family="sans-serif">{total}</text>
          {chr(10).join(labels)}
          </svg>'''

          if __name__ == "__main__":
              user = os.environ["GH_USER"]
              os.makedirs("assets", exist_ok=True)
              open("assets/momentum.svg", "w", encoding="utf-8").write(render(fetch(user, os.environ["GITHUB_TOKEN"])))
              print("momentum.svg written")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "chore: update 3D graph and momentum" || exit 0
          git push
